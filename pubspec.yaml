name: ecommerce_flutter
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  intl: ^0.20.2
  logger: ^2.7.0
  flutter_secure_storage: ^10.3.0
  flutter_svg: ^2.2.0
  provider: ^6.1.5+1
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/categories/
    - assets/icons/
    - assets/logos/

  fonts:
    - family: MonaSans
      fonts:
        - asset: assets/fonts/MonaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MonaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/MonaSans-Bold.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
